name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@example.com"

      - name: Install bash and shellcheck from Homebrew
        if: runner.os == 'macOS'
        run: |
          brew install bash shellcheck

      - name: Check script syntax
        run: |
          bash -n scripts/patchstack

      - name: Lint with shellcheck
        if: runner.os == 'Linux'
        run: |
          shellcheck scripts/patchstack

      - name: Run test suite
        run: |
          bash ./tests/run-all-tests.sh

      - name: Show test results summary
        if: always()
        run: |
          echo "Test suite completed"
